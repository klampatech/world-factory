<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>world-factory v2 explorer</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --ink: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --warn: #f0883e;
    --ok: #2ea043;
    --border: #30363d;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
  }
  #layout { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  #canvas-wrap { position: relative; background: #05080d; overflow: hidden; }
  #canvas { display: block; image-rendering: pixelated; }
  #status {
    position: absolute; top: 8px; left: 12px; color: var(--muted);
    background: rgba(14,17,22,0.7); padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }
  #side {
    background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 12px 14px;
  }
  h1 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  h2 {
    font-size: 12px; margin: 14px 0 4px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .toolbar { display: flex; gap: 6px; margin: 8px 0 10px; flex-wrap: wrap; }
  .toolbar button {
    background: #21262d; color: var(--ink); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar button.active {
    background: var(--accent); color: #0e1116; border-color: var(--accent);
    font-weight: 600;
  }
  .toolbar button::before { content: attr(data-marker) " "; opacity: 0.7; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row .k { color: var(--muted); }
  .row .v { color: var(--ink); }
  pre {
    background: #05080d; border: 1px solid var(--border); border-radius: 4px;
    padding: 8px; margin: 0; font-size: 11px; max-height: 200px; overflow: auto;
  }
  .pill {
    display: inline-block; padding: 1px 6px; border-radius: 8px;
    font-size: 11px; background: #21262d; color: var(--muted); margin-right: 4px;
  }
  .ok { color: var(--ok); }
  .bad { color: var(--warn); }
</style>
</head>
<body>
<div id="layout">
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="status" role="status" aria-live="polite">loading...</div>
  </div>
  <div id="side">
    <h1>world-factory v2 explorer</h1>
    <div class="toolbar" id="overlays" role="toolbar" aria-label="Layer toggles">
      <button type="button" data-overlay="biome" data-marker="B" class="active"
              aria-pressed="true">biome</button>
      <button type="button" data-overlay="elevation" data-marker="E"
              aria-pressed="false">elevation</button>
      <button type="button" data-overlay="rivers" data-marker="R"
              aria-pressed="false">rivers</button>
      <button type="button" data-overlay="settlements" data-marker="S"
              aria-pressed="false">settlements</button>
    </div>
    <div id="summary">click a cell to inspect.</div>
  </div>
</div>
<script>
(() => {
  "use strict";

  // -- biome palette + elevation band palette --
  // Single source of truth for biome colors. The Python package's
  // explorer/__init__.py references these names by string; if a
  // biome is added in models.BiomeClass, this table must follow.
  const BIOME_COLOR = Object.freeze({
    "ocean":              "#1e3a5f",
    "ice":                "#d0e8f2",
    "alpine":             "#8a8d94",
    "desert":             "#d4b87a",
    "tropical-forest":    "#1e5a2a",
    "temperate-forest":   "#2d7a3a",
    "grassland":          "#8cb04a",
  });
  // Elevation band colors. Painted when the user picks the
  // elevation overlay. Order: low (cold blue) -> high (red).
  const ELEVATION_BAND = Object.freeze([
    "#0b3b66", "#1f5e8a", "#3a82a4", "#74a9c2",
    "#c4d8a8", "#e7c474", "#c47a3c", "#8a3a1c",
  ]);

  const STATUS = document.getElementById("status");
  const CANVAS = document.getElementById("canvas");
  const CTX = CANVAS.getContext("2d");
  const SIDE = document.getElementById("summary");

  let WORLD = null;
  let OVERLAY = "biome";
  let HOVER_CELL = null;
  let SELECTED = null;

  // -- helpers --

  function setStatus(text) {
    STATUS.textContent = text;
  }

  function escapeText(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function biomeColor(name) {
    return BIOME_COLOR[name] || "#555";
  }

  function elevationBand(elevationMeters, seaLevelMeters) {
    // 8 bands derived from height above / below sea level. Tuned
    // for the LARGE scale (max ~5000 m, min ~-3000 m). For SMALL /
    // MEDIUM scales the bands still map cleanly because the
    // mapping is normalized by sea_level.
    const above = elevationMeters - seaLevelMeters;
    const idx = Math.min(
      ELEVATION_BAND.length - 1,
      Math.max(0, Math.floor((above + 1000) / 1000))
    );
    return ELEVATION_BAND[idx];
  }

  // -- load + render --

  async function loadWorld() {
    setStatus("fetching demo.json...");
    const res = await fetch("./demo.json");
    if (!res.ok) {
      throw new Error(`failed to load demo.json: ${res.status} ${res.statusText}`);
    }
    const envelope = await res.json();
    const data = envelope && envelope.data ? envelope.data : envelope;
    if (!data || typeof data !== "object") {
      throw new Error("demo.json envelope has no .data");
    }
    validateShape(data);
    WORLD = data;
    setupCanvas();
    paint();
    setStatus(
      `world_id=${WORLD.world_id} scale=${WORLD.scale} ` +
      `${WORLD.grid_width}x${WORLD.grid_height} ` +
      `ocean=${(WORLD.surface_water_fraction * 100).toFixed(1)}% ` +
      `settlements=${WORLD.settlement_count} ` +
      `biomes=${WORLD.biome_counts.length} ` +
      `is_valid=${WORLD.is_valid}`
    );
  }

  function validateShape(data) {
    const required = [
      "world_id", "scale", "is_valid", "biome_counts",
      "sample_polity_summary", "grid_width", "grid_height",
      "biome_grid", "river_cells", "settlement_cells",
    ];
    for (const key of required) {
      if (!(key in data)) {
        throw new Error(`demo.json missing required field: ${key}`);
      }
    }
    const expected = data.grid_width * data.grid_height;
    if (data.biome_grid.length !== expected) {
      throw new Error(
        `biome_grid length ${data.biome_grid.length} != ` +
        `${data.grid_width} * ${data.grid_height} = ${expected}`
      );
    }
  }

  function setupCanvas() {
    const wrap = document.getElementById("canvas-wrap");
    const dpr = window.devicePixelRatio || 1;
    const cssW = wrap.clientWidth;
    const cssH = wrap.clientHeight;
    CANVAS.width  = Math.max(1, Math.floor(cssW * dpr));
    CANVAS.height = Math.max(1, Math.floor(cssH * dpr));
    CANVAS.style.width  = cssW + "px";
    CANVAS.style.height = cssH + "px";
    CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
    CTX.fillStyle = "#05080d";
    CTX.fillRect(0, 0, cssW, cssH);
  }

  function cellPixelBounds() {
    const wrapW = parseFloat(CANVAS.style.width);
    const wrapH = parseFloat(CANVAS.style.height);
    const cellW = wrapW / WORLD.grid_width;
    const cellH = wrapH / WORLD.grid_height;
    return { cellW, cellH, wrapW, wrapH };
  }

  function paint() {
    if (!WORLD) return;
    const { cellW, cellH, wrapW, wrapH } = cellPixelBounds();
    CTX.fillStyle = "#05080d";
    CTX.fillRect(0, 0, wrapW, wrapH);

    const seaLevel = 0.0;  // V1: sea_level is always 0; the v2.1
                            // explorer will read it from the JSON.

    // Pass 1: per-cell base layer (biome or elevation band).
    for (let y = 0; y < WORLD.grid_height; y++) {
      for (let x = 0; x < WORLD.grid_width; x++) {
        const idx = y * WORLD.grid_width + x;
        const biome = WORLD.biome_grid[idx];
        let color;
        if (OVERLAY === "elevation") {
          // elevation is not in demo.json v1; derive a proxy band
          // from biome so the toggle still shows something
          // distinct. v2.1 ships `elevation_grid` in the JSON.
          color = elevationBand(proxyElevation(biome), seaLevel);
        } else {
          color = biomeColor(biome);
        }
        CTX.fillStyle = color;
        CTX.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
      }
    }

    // Pass 2: rivers overlay (always paints a tint when toggled).
    if (OVERLAY === "rivers" || OVERLAY === "biome") {
      CTX.fillStyle = "rgba(64, 156, 255, 0.85)";
      for (const cell of WORLD.river_cells) {
        CTX.fillRect(cell[0] * cellW, cell[1] * cellH, cellW + 0.5, cellH + 0.5);
      }
    }

    // Pass 3: settlements overlay.
    if (OVERLAY === "settlements" || OVERLAY === "biome") {
      for (const cell of WORLD.settlement_cells) {
        const x = cell[0] * cellW;
        const y = cell[1] * cellH;
        CTX.fillStyle = "#0e1116";
        CTX.fillRect(x, y, cellW, cellH);
        CTX.fillStyle = "#f0883e";
        CTX.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
      }
    }

    paintHover();
    paintSelection();
  }

  // Proxy elevation band derived from biome name. Used because
  // demo.json v1 does not include elevation_grid. Order: ocean <
  // desert < grassland < forest < alpine < ice.
  function proxyElevation(biome) {
    switch (biome) {
      case "ocean":              return -500;
      case "desert":             return 300;
      case "grassland":          return 600;
      case "tropical-forest":    return 800;
      case "temperate-forest":   return 1000;
      case "alpine":             return 2500;
      case "ice":                return 1500;
      default:                   return 500;
    }
  }

  function paintHover() {
    if (!HOVER_CELL) return;
    const { cellW, cellH } = cellPixelBounds();
    CTX.strokeStyle = "#58a6ff";
    CTX.lineWidth = 2;
    CTX.strokeRect(
      HOVER_CELL.x * cellW + 1,
      HOVER_CELL.y * cellH + 1,
      cellW - 2,
      cellH - 2
    );
  }

  function paintSelection() {
    if (!SELECTED) return;
    const { cellW, cellH } = cellPixelBounds();
    CTX.strokeStyle = "#f0883e";
    CTX.lineWidth = 3;
    CTX.strokeRect(
      SELECTED.x * cellW + 0.5,
      SELECTED.y * cellH + 0.5,
      cellW - 1,
      cellH - 1
    );
  }

  // -- interactions --

  function canvasToCell(ev) {
    const rect = CANVAS.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return null;
    const px = ev.clientX - rect.left;
    const py = ev.clientY - rect.top;
    const x = Math.floor((px / rect.width) * WORLD.grid_width);
    const y = Math.floor((py / rect.height) * WORLD.grid_height);
    if (x < 0 || x >= WORLD.grid_width) return null;
    if (y < 0 || y >= WORLD.grid_height) return null;
    return { x, y };
  }

  CANVAS.addEventListener("mousemove", (ev) => {
    const cell = canvasToCell(ev);
    if (!cell) {
      if (HOVER_CELL !== null) {
        HOVER_CELL = null;
        paint();
      }
      return;
    }
    HOVER_CELL = cell;
    paint();
  });

  CANVAS.addEventListener("click", (ev) => {
    const cell = canvasToCell(ev);
    if (!cell) return;
    SELECTED = cell;
    renderSummary(cell);
    paint();
  });

  CANVAS.addEventListener("mouseleave", () => {
    HOVER_CELL = null;
    paint();
  });

  document.getElementById("overlays").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-overlay]");
    if (!btn) return;
    OVERLAY = btn.dataset.overlay;
    for (const b of document.querySelectorAll("button[data-overlay]")) {
      const active = b === btn;
      b.classList.toggle("active", active);
      b.setAttribute("aria-pressed", active ? "true" : "false");
    }
    paint();
  });

  // -- summary panel --

  // Build a stable map from (x, y) -> CellSummary. We have full
  // summaries for the sample polity cell and its 3x3 bioregion;
  // other cells fall back to a minimal client-side CellSummary
  // derived from `biome_grid`. v2.1 will add per-cell summaries
  // when the underlying simulation layers ship.
  function buildSummaryIndex() {
    const index = new Map();
    for (const summary of WORLD.sample_bioregion_summaries || []) {
      index.set(`${summary.x},${summary.y}`, summary);
    }
    index.set(
      `${WORLD.sample_polity_summary.x},${WORLD.sample_polity_summary.y}`,
      WORLD.sample_polity_summary
    );
    return index;
  }

  function renderSummary(cell) {
    if (!WORLD) return;
    const sample = WORLD.sample_polity_summary;
    const summaryIndex = buildSummaryIndex();
    const exact = summaryIndex.get(`${cell.x},${cell.y}`);
    const isSample = cell.x === sample.x && cell.y === sample.y;
    const biome = WORLD.biome_grid[cell.y * WORLD.grid_width + cell.x];

    const rows = [];
    rows.push(["cell", `(${cell.x}, ${cell.y})`]);
    rows.push(["biome", biome]);
    rows.push(["ocean", biome === "ocean" ? "yes" : "no"]);

    if (exact) {
      rows.push(["elevation", `${exact.elevation_meters.toFixed(1)} m`]);
      rows.push(["temperature", `${exact.temperature_celsius.toFixed(2)} degC`]);
      rows.push(["precipitation", `${exact.annual_precipitation_mm.toFixed(0)} mm/yr`]);
      rows.push(["pressure", `${exact.atmospheric_pressure_kpa.toFixed(2)} kPa`]);
      rows.push(["wind", exact.wind_direction]);
      rows.push(["rock", exact.rock_type]);
      rows.push(["soil", exact.soil_type]);
      rows.push(["flora / fauna", `${exact.flora} / ${exact.fauna}`]);
      rows.push(["ore", exact.has_ore ? "yes" : "no"]);
      rows.push(["settlements on this cell", String(exact.settlements.length)]);
      rows.push(["river mouths on this cell", String(exact.river_segments.length)]);
    } else {
      rows.push(["full summary", "bioregion sample only"]);
    }

    let html = `<h2>cell (${cell.x}, ${cell.y})</h2>`;
    for (const [k, v] of rows) {
      html += `<div class="row"><span class="k">${escapeText(k)}</span>` +
              `<span class="v">${escapeText(v)}</span></div>`;
    }
    html += `<h2>world</h2>`;
    html += `<div class="row"><span class="k">world_id</span>` +
            `<span class="v">${escapeText(WORLD.world_id)}</span></div>`;
    html += `<div class="row"><span class="k">scale</span>` +
            `<span class="v">${escapeText(WORLD.scale)}</span></div>`;
    html += `<div class="row"><span class="k">is_valid</span>` +
            `<span class="v ${WORLD.is_valid ? "ok" : "bad"}">` +
            `${WORLD.is_valid}</span></div>`;
    html += `<div class="row"><span class="k">query_surface_validates</span>` +
            `<span class="v ${WORLD.query_surface_validates ? "ok" : "bad"}">` +
            `${WORLD.query_surface_validates}</span></div>`;

    if (exact && exact.settlements.length > 0) {
      html += `<h2>sample polity</h2>` +
              `<pre>${escapeText(JSON.stringify(exact.settlements[0], null, 2))}</pre>`;
    }
    if (isSample) {
      html += `<h2>note</h2><div class="pill ok">sample polity</div>`;
    }
    SIDE.innerHTML = html;
  }

  // -- boot --

  loadWorld().catch((err) => {
    setStatus(`error: ${err.message}`);
    SIDE.textContent = `load failed: ${err.message}`;
  });

  // Re-paint on resize so the canvas stays in sync with the
  // viewport. Throttle to one paint per animation frame.
  let resizeQueued = false;
  window.addEventListener("resize", () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      if (!WORLD) return;
      setupCanvas();
      paint();
    });
  });
})();
</script>
</body>
</html>
