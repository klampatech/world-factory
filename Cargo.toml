[package]
name = "world-factory"
version = "0.1.0"
edition = "2021"
authors = ["World Factory Team"]
description = "Procedural world and history generation engine"
license = "MIT"
repository = ""

[features]
default = []
api = ["axum", "tokio", "tower", "tower-http", "tracing", "tracing-subscriber"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_arrays = "0.2"
toml = "1.1"
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
flate2 = "1.0"
tempfile = "3.10"
serde_yaml = "0.9"

# CLI argument parsing
clap = { version = "=4.2.0", features = ["derive"] }

# Optional API dependencies (enabled with --features api)
axum = { version = "0.8", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs", "trace", "cors"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# Logging
log = "0.4"

# Dependencies to evaluate:
rand = "0.8"       # RNG
# petgraph = "0.6"   # Entity graphs
# rayon = "1.5"      # Parallel generation
# kdam = "0.2"       # Progress bars

[dev-dependencies]
proptest = "1.2"
regex-lite = "0.1"
axum = "0.8"
tower = "0.5"
tokio = { version = "1.0", features = ["full"] }

[[example]]
name = "resource_spawning"
path = "examples/resource_spawning.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "world_generator"
path = "src/main.rs"
