<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Factory - Map Overlays Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #f9fafb;
    }
    .app {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    
    /* Map background */
    .map-layer {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 40%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0f1419 0%, #1a1f2e 100%);
    }
    .map-layer svg {
      width: 100%;
      height: 100%;
    }
    
    /* Overlay panel */
    .overlay-panel {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 320px;
      max-width: calc(100vw - 2rem);
    }
    .overlay-panel-inner {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .overlay-panel h3 {
      margin: 0 0 0.75rem 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: #f3f4f6;
    }
    
    /* Toggle buttons */
    .overlay-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .overlay-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid #374151;
      background: transparent;
      color: #f9fafb;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .overlay-toggle:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .overlay-toggle:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
    .overlay-toggle.active-resources {
      border-color: #f59e0b;
      background: rgba(251, 191, 36, 0.4);
    }
    .overlay-toggle.active-elevation {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.4);
    }
    .overlay-toggle.active-political {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.3);
    }
    .overlay-toggle.active-ocean {
      border-color: #0ea5e9;
      background: rgba(14, 165, 233, 0.4);
    }
    
    /* Legend */
    .legend {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      color: #f3f4f6;
    }
    .legend h4 {
      margin: 0 0 0.5rem 0;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .legend-items {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
    
    /* Region polygons */
    .region-polygon {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .region-polygon:hover {
      filter: brightness(1.2);
    }
    .region-polygon.selected {
      stroke: #facc15;
      stroke-width: 3;
    }
    .region-label {
      fill: #9ca3af;
      font-size: 14px;
      text-anchor: middle;
      pointer-events: none;
    }
    
    /* Tooltip */
    .tooltip {
      position: fixed;
      width: 280px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      font-size: 0.875rem;
    }
    .tooltip-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .tooltip-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #f3f4f6;
    }
    .tooltip-close {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 0.25rem;
      font-size: 1.25rem;
      line-height: 1;
    }
    .tooltip-row {
      margin-bottom: 0.5rem;
      color: #d1d5db;
    }
    .tooltip-row strong {
      color: #9ca3af;
    }
    .resource-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .resource-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      background: #374151;
      color: #f3f4f6;
      font-size: 0.75rem;
      text-transform: capitalize;
    }
    .resource-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }
    
    /* Instructions */
    .instructions {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 0.5rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    kbd {
      background: #374151;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
    }
    
    /* Loading spinner */
    .loading {
      padding: 1rem;
      text-align: center;
      color: #9ca3af;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #4b5563;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 0.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="map-layer">
      <svg viewBox="0 0 1000 600">
        <!-- Northmarch -->
        <polygon class="region-polygon" id="region-1" 
          points="100,100 250,100 250,200 100,200"
          fill="rgba(100, 116, 139, 0.2)"
          stroke="#475569"
          stroke-width="2"
          data-name="Northmarch"
          data-population="45000"
          data-resource="iron"
          data-resources='["iron", "timber"]'
          data-faction="Ironhold Clan"
          data-elevation="800"
          data-terrain="highlands"
        />
        <text class="region-label" x="175" y="155">Northmarch</text>
        
        <!-- Gold Coast -->
        <polygon class="region-polygon" id="region-2"
          points="260,100 450,100 450,200 260,200"
          fill="rgba(100, 116, 139, 0.2)"
          stroke="#475569"
          stroke-width="2"
          data-name="Gold Coast"
          data-population="120000"
          data-resource="gold"
          data-resources='["gold", "gems", "spices"]'
          data-faction="Meridian Empire"
          data-elevation="200"
          data-terrain="plains"
        />
        <text class="region-label" x="355" y="155">Gold Coast</text>
        
        <!-- Stormpeak -->
        <polygon class="region-polygon" id="region-3"
          points="460,100 700,100 700,200 460,200"
          fill="rgba(100, 116, 139, 0.2)"
          stroke="#475569"
          stroke-width="2"
          data-name="Stormpeak"
          data-population="28000"
          data-resource="gems"
          data-resources='["gems", "iron"]'
          data-faction="Mountain Kings"
          data-elevation="3200"
          data-terrain="mountains"
        />
        <text class="region-label" x="580" y="155">Stormpeak</text>
      </svg>
    </div>
    
    <div class="overlay-panel">
      <div class="overlay-panel-inner">
        <h3>Map Overlays</h3>
        
        <div class="overlay-toggles" role="group" aria-label="Map overlay controls">
          <button class="overlay-toggle" id="toggle-resources" type="button">
            ⬡ Resources
          </button>
          <button class="overlay-toggle" id="toggle-elevation" type="button">
            ⛰ Elevation
          </button>
          <button class="overlay-toggle" id="toggle-political" type="button">
            ⚔ Political
          </button>
          <button class="overlay-toggle" id="toggle-ocean" type="button">
            🌊 Ocean
          </button>
        </div>
        
        <div class="legend" id="legend">
          <h4 id="legend-title">No Overlay</h4>
          <p id="legend-content" style="color: #9ca3af; margin: 0;">
            Select an overlay to view its legend
          </p>
        </div>
      </div>
    </div>
    
    <div class="instructions">
      <kbd>Click</kbd> a region for details • Toggle overlays above
    </div>
    
    <!-- Tooltip container -->
    <div id="tooltip" class="tooltip" style="display: none;"></div>
  </div>
  
  <script>
    // State
    let activeOverlay = null;
    let selectedRegion = null;
    
    // DOM elements
    const toggles = {
      resources: document.getElementById('toggle-resources'),
      elevation: document.getElementById('toggle-elevation'),
      political: document.getElementById('toggle-political'),
      ocean: document.getElementById('toggle-ocean'),
    };
    const legend = document.getElementById('legend');
    const legendTitle = document.getElementById('legend-title');
    const legendContent = document.getElementById('legend-content');
    const tooltip = document.getElementById('tooltip');
    const polygons = document.querySelectorAll('.region-polygon');
    
    // Colors
    const elevationColors = [
      { max: 500, color: '#22c55e', label: 'Lowlands' },
      { max: 1500, color: '#84cc16', label: 'Hills' },
      { max: 3000, color: '#eab308', label: 'Mountains' },
      { max: 5000, color: '#94a3b8', label: 'High Peaks' },
    ];
    
    const resourceColors = {
      iron: '#78716c',
      gold: '#fbbf24',
      gems: '#a78bfa',
      timber: '#22c55e',
      spices: '#f97316',
    };
    
    const factionColors = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6'];
    
    // Ocean depth colors (mirrors Rust OceanZone)
    const oceanDepthColors = {
      land: { color: '#4ade80', label: 'Land' },
      shallow: { color: '#38bdf8', label: 'Shallow Ocean' },
      medium: { color: '#0ea5e9', label: 'Medium Ocean' },
      deep: { color: '#0369a1', label: 'Deep Ocean' },
    };
    
    // Detect ocean zone from elevation (mirrors Rust OceanDetector::detect_zone)
    function detectOceanZone(elevation) {
      if (elevation > 0) {
        // elevation > 0 = land (Rust: elevation > ocean_elevation_threshold)
        return 'land';
      }
      if (elevation <= 0.1) {
        // elevation <= 0.1 (shallow threshold) = deep
        return 'deep';
      }
      if (elevation <= 0.5) {
        // elevation <= 0.5 (deep threshold) = medium
        return 'medium';
      }
      // Above shallow but at/below sea level = shallow
      return 'shallow';
    }
    
    // Get elevation color
    function getElevationColor(elevation) {
      for (const step of elevationColors) {
        if (elevation <= step.max) return step.color;
      }
      return elevationColors[elevationColors.length - 1].color;
    }
    
    // Get faction color
    function getFactionColor(faction) {
      let hash = 0;
      for (let i = 0; i < faction.length; i++) {
        hash = ((hash << 5) - hash) + faction.charCodeAt(i);
      }
      return factionColors[Math.abs(hash) % factionColors.length];
    }
    
    // Toggle overlay
    function toggleOverlay(type) {
      if (activeOverlay === type) {
        activeOverlay = null;
      } else {
        activeOverlay = type;
      }
      updateOverlays();
    }
    
    // Update overlay visuals
    function updateOverlays() {
      // Update toggle buttons
      Object.entries(toggles).forEach(([type, btn]) => {
        btn.classList.remove('active-resources', 'active-elevation', 'active-political');
        if (activeOverlay === type) {
          btn.classList.add('active-' + type);
        }
      });
      
      // Update legend
      if (!activeOverlay) {
        legendTitle.textContent = 'No Overlay';
        legendContent.innerHTML = 'Select an overlay to view its legend';
      } else if (activeOverlay === 'elevation') {
        legendTitle.textContent = 'Elevation Legend';
        let html = '<div class="legend-items">';
        elevationColors.forEach(step => {
          html += `<div class="legend-item">
            <div class="legend-color" style="background: ${step.color}"></div>
            ${step.label}
          </div>`;
        });
        html += '</div>';
        legendContent.innerHTML = html;
        
        // Color polygons
        polygons.forEach(poly => {
          const elev = parseInt(poly.dataset.elevation);
          poly.style.fill = getElevationColor(elev) + '66';
        });
      } else if (activeOverlay === 'resources') {
        legendTitle.textContent = 'Resources Legend';
        let html = '<div class="legend-items">';
        Object.entries(resourceColors).forEach(([resource, color]) => {
          html += `<div class="legend-item">
            <div class="legend-color" style="background: ${color}"></div>
            ${resource.charAt(0).toUpperCase() + resource.slice(1)}
          </div>`;
        });
        html += '</div>';
        legendContent.innerHTML = html;
        
        // Color polygons
        polygons.forEach(poly => {
          const resource = poly.dataset.resource;
          poly.style.fill = (resourceColors[resource] || '#fbbf24') + '66';
        });
      } else if (activeOverlay === 'political') {
        legendTitle.textContent = 'Political Legend';
        let html = '<div class="legend-items">';
        ['Ironhold Clan', 'Meridian Empire', 'Mountain Kings'].forEach((faction, i) => {
          html += `<div class="legend-item">
            <div class="legend-color" style="background: ${factionColors[i]}"></div>
            ${faction}
          </div>`;
        });
        html += '</div>';
        legendContent.innerHTML = html;
        
        // Color polygons
        polygons.forEach(poly => {
          const faction = poly.dataset.faction;
          poly.style.fill = getFactionColor(faction) + '66';
        });
      } else if (activeOverlay === 'ocean') {
        legendTitle.textContent = 'Ocean Depth Legend';
        let html = '<div class="legend-items">';
        Object.entries(oceanDepthColors).forEach(([zone, config]) => {
          html += `<div class="legend-item">
            <div class="legend-color" style="background: ${config.color}"></div>
            ${config.label}
          </div>`;
        });
        html += '</div>';
        html += '<div style="margin-top: 0.5rem; font-size: 0.65rem; color: #9ca3af;">'
             + 'Coastal land highlighted in green</div>';
        legendContent.innerHTML = html;
        
        // Color polygons by ocean depth zone
        polygons.forEach(poly => {
          const elev = parseInt(poly.dataset.elevation);
          const zone = detectOceanZone(elev);
          if (zone === 'land') {
            // Coastal land styling
            poly.style.fill = '#86efac66';
            poly.style.stroke = '#22c55e';
          } else {
            poly.style.fill = oceanDepthColors[zone].color + '99';
            poly.style.stroke = '#475569';
          }
        });
      }
    }
    
    // Show tooltip
    function showTooltip(poly, event) {
      const data = {
        name: poly.dataset.name,
        population: parseInt(poly.dataset.population).toLocaleString(),
        resource: poly.dataset.resource,
        resources: JSON.parse(poly.dataset.resources),
        faction: poly.dataset.faction,
        elevation: parseInt(poly.dataset.elevation).toLocaleString(),
        terrain: poly.dataset.terrain,
      };
      
      let resourcesHtml = data.resources.map(r => 
        `<span class="resource-tag">
          <span class="resource-dot" style="background: ${resourceColors[r] || '#9ca3af'}"></span>
          ${r}
        </span>`
      ).join('');
      
      tooltip.innerHTML = `
        <div class="tooltip-header">
          <h3>${data.name}</h3>
          <button class="tooltip-close" onclick="hideTooltip()">×</button>
        </div>
        <div class="tooltip-row"><strong>Faction:</strong> ${data.faction}</div>
        <div class="tooltip-row"><strong>Population:</strong> ${data.population}</div>
        <div class="tooltip-row">
          <strong>Terrain:</strong> ${data.terrain.charAt(0).toUpperCase() + data.terrain.slice(1)}
          <span style="color: #6b7280"> (${data.elevation}m)</span>
        </div>
        <div class="tooltip-row">
          <strong>Resources:</strong>
          <div class="resource-tags">${resourcesHtml}</div>
        </div>
      `;
      
      // Position tooltip
      const x = event.clientX;
      const y = event.clientY;
      const rect = tooltip.getBoundingClientRect();
      
      let left = x + 12;
      let top = y + 12;
      
      if (left + rect.width > window.innerWidth) {
        left = x - rect.width - 12;
      }
      if (top + rect.height > window.innerHeight) {
        top = y - rect.height - 12;
      }
      
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
      tooltip.style.display = 'block';
      
      selectedRegion = poly.id;
      poly.classList.add('selected');
    }
    
    // Hide tooltip
    function hideTooltip() {
      tooltip.style.display = 'none';
      polygons.forEach(p => p.classList.remove('selected'));
      selectedRegion = null;
    }
    
    // Event listeners
    Object.entries(toggles).forEach(([type, btn]) => {
      btn.addEventListener('click', () => toggleOverlay(type));
    });
    
    polygons.forEach(poly => {
      poly.addEventListener('click', (e) => {
        if (selectedRegion === poly.id) {
          hideTooltip();
        } else {
          if (selectedRegion) {
            polygons.forEach(p => p.classList.remove('selected'));
          }
          showTooltip(poly, e);
        }
      });
      
      // Keyboard support
      poly.setAttribute('tabindex', '0');
      poly.setAttribute('role', 'button');
      poly.setAttribute('aria-label', poly.dataset.name + ' region');
      poly.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          poly.click();
        }
      });
    });
  </script>
</body>
</html>
