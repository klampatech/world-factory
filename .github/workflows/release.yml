name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_version:
        description: 'Version to deploy to production (e.g. 1.2.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Build, test, create GitHub release
  # Runs only when the release PR is merged (pull_request.merged == true)
  # ============================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Extract version from post-merge state
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Run tests
        run: cargo test --lib -- --nocapture --skip voronoi_property_tests

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ steps.version.outputs.version }}
          path: target/release/world_generator
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            ## Release ${{ steps.version.outputs.version }}

            See the [changelog](./CHANGELOG.md) for details.
          generate_release_notes: true
          files: target/release/world_generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 2: Deploy to staging (runs after create-release succeeds)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: create-release
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary-${{ steps.version.outputs.version }}
          path: target/release

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::notice::Staging deploy skipped: secrets not configured"
            exit 0
          fi

          echo "$STAGING_SSH_KEY" > /tmp/staging_key
          chmod 600 /tmp/staging_key

          chmod +x target/release/world_generator

          scp -o StrictHostKeyChecking=no -i /tmp/staging_key \
            target/release/world_generator \
            ${STAGING_USER}@${STAGING_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/staging_key \
            ${STAGING_USER}@${STAGING_HOST} "
            cd ~/world-factory
            pkill world_generator 2>/dev/null || true
            mv world_generator world_generator-\${{ steps.version.outputs.version }}
            ln -sf world_generator-\${{ steps.version.outputs.version }} world_generator
            echo 'Deployed v\${{ steps.version.outputs.version }} to staging'
          "

  # ============================================================
  # Job 3: Deploy to production (manual trigger only)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Set version from input
        id: version
        run: |
          VERSION="${{ github.event.inputs.production_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release

      - name: Deploy to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_USER" ] || [ -z "$PRODUCTION_SSH_KEY" ]; then
            echo "::notice::Production deploy skipped: secrets not configured"
            exit 0
          fi

          echo "$PRODUCTION_SSH_KEY" > /tmp/prod_key
          chmod 600 /tmp/prod_key

          chmod +x target/release/world_generator

          scp -o StrictHostKeyChecking=no -i /tmp/prod_key \
            target/release/world_generator \
            ${PRODUCTION_USER}@${PRODUCTION_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/prod_key \
            ${PRODUCTION_USER}@${PRODUCTION_HOST} "
            cd ~/world-factory
            pkill world_generator 2>/dev/null || true
            mv world_generator world_generator-\${{ steps.version.outputs.version }}
            ln -sf world_generator-\${{ steps.version.outputs.version }} world_generator
            echo 'Deployed v\${{ steps.version.outputs.version }} to production'
          "