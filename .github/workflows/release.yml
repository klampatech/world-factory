name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_version:
        description: 'Version to deploy to production (e.g. 1.2.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Version bump + commit + tag (only on non-tag push)
  # ============================================================
  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    # Only run when pushing a branch to main (not when pushing a tag)
    if: github.event_name == 'push' && github.ref_type == 'branch'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump minor version
        id: version
        run: |
          CURRENT=${{ steps.current_version.outputs.current }}
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_MINOR=$((minor + 1))
          NEW_VERSION="$major.$NEW_MINOR.0"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm pkg set version="${{ steps.version.outputs.new_version }}"

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Create commit and tag
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.new_version }}"
          add_options: package.json Cargo.toml
          tagging_message: ${{ steps.version.outputs.tag }}

      - name: Push commit and tag
        run: |
          git push
          git push origin ${{ steps.version.outputs.tag }}

  # ============================================================
  # Job 2: Create GitHub Release (runs after version-bump)
  # ============================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.version-bump.outputs.tag }}

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Ensure package.json matches tag
        run: npm pkg set version="$VERSION"

      - name: Ensure Cargo.toml matches tag
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Commit version sync
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync versions for release ${{ steps.version.outputs.version }}"
          add_options: package.json Cargo.toml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Release ${{ steps.version.outputs.version }}

            See the [changelog](./CHANGELOG.md) for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 3: Deploy to staging (runs after release)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: create-release
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::notice::Staging deploy skipped: secrets not configured"
            exit 0
          fi

          echo "$STAGING_SSH_KEY" > /tmp/staging_key
          chmod 600 /tmp/staging_key

          mkdir -p /tmp/deploy
          cp target/release/world_generator /tmp/deploy/

          scp -o StrictHostKeyChecking=no -i /tmp/staging_key \
            /tmp/deploy/world_generator \
            ${STAGING_USER}@${STAGING_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/staging_key \
            ${STAGING_USER}@${STAGING_HOST} "
            cd ~/world-factory
            pkill world_generator 2>/dev/null || true
            mv world_generator world_generator-\${{ steps.version.outputs.version }}
            ln -sf world_generator-\${{ steps.version.outputs.version }} world_generator
            echo 'Deployed v\${{ steps.version.outputs.version }}'
          "

  # ============================================================
  # Job 4: Deploy to production (manual trigger only)
  # Trigger: workflow_dispatch with production_version input
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    # Only run via manual trigger with version input
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Set version from input
        id: version
        run: |
          VERSION="${{ github.event.inputs.production_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release

      - name: Deploy to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_USER" ] || [ -z "$PRODUCTION_SSH_KEY" ]; then
            echo "::notice::Production deploy skipped: secrets not configured"
            exit 0
          fi

          echo "$PRODUCTION_SSH_KEY" > /tmp/prod_key
          chmod 600 /tmp/prod_key

          mkdir -p /tmp/deploy
          cp target/release/world_generator /tmp/deploy/

          scp -o StrictHostKeyChecking=no -i /tmp/prod_key \
            /tmp/deploy/world_generator \
            ${PRODUCTION_USER}@${PRODUCTION_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/prod_key \
            ${PRODUCTION_USER}@${PRODUCTION_HOST} "
            cd ~/world-factory
            pkill world_generator 2>/dev/null || true
            mv world_generator world_generator-\${{ steps.version.outputs.version }}
            ln -sf world_generator-\${{ steps.version.outputs.version }} world_generator
            echo 'Deployed v\${{ steps.version.outputs.version }}'
          "