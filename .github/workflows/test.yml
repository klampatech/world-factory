name: World Factory Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Job 1: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          rustflags: '-D warnings'
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          toolchain: stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run unit tests
        run: cargo test --lib -- --nocapture
      
      - name: Run doc tests
        run: cargo test --doc
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/test-results/**/*.xml

  # ============================================================
  # Job 3: Integration Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          toolchain: stable
      
      - name: Run integration tests
        run: |
          cargo test --test integration_world_generation
          cargo test --test phase2_integration_test
          cargo test --test phase1_integration_test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/test-results/**/*.xml

  # ============================================================
  # Job 4: API Tests
  # ============================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: world_factory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          toolchain: stable
      
      - name: Setup test database
        env:
          POSTGRES_PASSWORD: test
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE world_factory_test;" || true
      
      - name: Build with API feature
        run: cargo build --features api
      
      - name: Run API tests
        run: cargo test --test api_world_generation -- --nocapture
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: target/test-results/**/*.xml

  # ============================================================
  # Job 5: Frontend E2E Tests (Playwright)
  # ============================================================
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build frontend
        run: npm run build
      
      - name: Start preview server
        run: npm run preview &
        sleep 5
      
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/

  # ============================================================
  # Job 6: Performance Benchmarks
  # ============================================================
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          toolchain: stable
      
      - name: Run benchmarks
        run: |
          cargo bench --no-run || true
          # Custom benchmark runner
          ./scripts/run_benchmarks.sh
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/**/*.json

  # ============================================================
  # Job 7: Full Pipeline (Nightly)
  # ============================================================
  nightly-full-pipeline:
    name: Full Pipeline (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust@v1
        with:
          toolchain: stable
      
      - name: Full test suite
        run: |
          cargo test --workspace --all-features
          npm test
          npx playwright test
      
      - name: Generate coverage report
        run: |
          cargo tarpaulin --workspace --out Xml
          npx nyc npm test  # frontend coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: target/tarpaulin/coverage.xml
          fail_ci_if_error: true

  # ============================================================
  # Job 8: Notify on Failure
  # ============================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, api-tests, frontend-e2e]
    if: always() && (needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' || needs.api-tests.result == 'failure' || needs.frontend-e2e.result == 'failure')
    
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'testing'
          payload: |
            {
              "text": "World Factory Tests Failed :x:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*World Factory Test Failure*\n${{ needs.unit-tests.result }} Unit Tests | ${{ needs.integration-tests.result }} Integration Tests"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
