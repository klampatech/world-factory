name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Build, Test, and Release
  # ============================================================
  build-test-release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --all-features

      - name: Run tests
        run: cargo test --lib -- --nocapture --skip voronoi_property_tests

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "VERSION=${VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "FULL_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "tag_name=release/${VERSION}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: target/release/world_generator
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag_name }}
          name: "Release ${{ env.FULL_VERSION }} (${{ env.SHORT_SHA }})"
          generate_release_notes: true
          files: target/release/world_generator

  # ============================================================
  # Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-test-release
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Deploy to staging
        run: |
          chmod +x world_generator
          echo "Deploying to staging"

  # ============================================================
  # Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Deploy to production
        run: |
          chmod +x world_generator
          echo "Deploying to production"
