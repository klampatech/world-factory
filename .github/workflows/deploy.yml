name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Build and Test (Gate)
  # ============================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles("**/Cargo.lock") }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles("**/Cargo.lock") }}

      - name: Build release
        run: cargo build --release --all-features

      - name: Run tests
        run: cargo test --workspace

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/world_generator
          retention-days: 7

  # ============================================================
  # Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          # Ensure binary is executable
          chmod +x world_generator
          
          # Deploy script (placeholder - customize for your infrastructure)
          echo "Deploying to staging: $STAGING_HOST"
          # scp -i $STAGING_KEY world_generator user@$STAGING_HOST:/opt/world-factory/
          # ssh -i $STAGING_KEY user@$STAGING_HOST "systemctl restart world-factory"

  # ============================================================
  # Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: contains(github.ref, 'tags/v')
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Deploy to production
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          # Ensure binary is executable
          chmod +x world_generator
          
          # Deploy script (placeholder - customize for your infrastructure)
          echo "Deploying to production: $PRODUCTION_HOST"
          # scp -i $PRODUCTION_KEY world_generator user@$PRODUCTION_HOST:/opt/world-factory/
          # ssh -i $PRODUCTION_KEY user@$PRODUCTION_HOST "systemctl restart world-factory"

      - name: Create GitHub Release
        if: contains(github.ref, 'tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: world_generator
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
