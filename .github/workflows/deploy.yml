name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event.inputs.environment == 'staging'
    steps:
      - uses: actions/checkout@v6

      - name: Get release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::notice::Staging deploy skipped: secrets not configured"
            exit 0
          fi

          # Write SSH key
          echo "$STAGING_SSH_KEY" > /tmp/staging_key
          chmod 600 /tmp/staging_key

          # Create deploy package (binary + web frontend)
          mkdir -p /tmp/deploy
          cp target/release/world_generator /tmp/deploy/
          cp -r web /tmp/deploy/

          # Bundle into tarball
          tar -czf /tmp/world-factory.tar.gz -C /tmp/deploy .
          chmod +x /tmp/deploy/world_generator

          # Deploy via SSH
          scp -o StrictHostKeyChecking=no -i /tmp/staging_key \
            /tmp/world-factory.tar.gz \
            ${STAGING_USER}@${STAGING_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/staging_key \
            ${STAGING_USER}@${STAGING_HOST} "
            cd ~/world-factory
            mkdir -p world-factory-\${{ steps.version.outputs.version }}
            tar -xzf world-factory.tar.gz -C world-factory-\${{ steps.version.outputs.version }}
            chown -R deploy:deploy ~/world-factory/
            ln -sf world-factory-\${{ steps.version.outputs.version }}/world_generator world_generator
            systemctl restart world-factory
            echo 'Deployed v\${{ steps.version.outputs.version }} to staging'
          "

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v6

      - name: Get release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Deploy to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_USER" ] || [ -z "$PRODUCTION_SSH_KEY" ]; then
            echo "::notice::Production deploy skipped: secrets not configured"
            exit 0
          fi

          # Write SSH key
          echo "$PRODUCTION_SSH_KEY" > /tmp/prod_key
          chmod 600 /tmp/prod_key

          # Create deploy package (binary + web frontend)
          mkdir -p /tmp/deploy
          cp target/release/world_generator /tmp/deploy/
          cp -r web /tmp/deploy/

          # Bundle into tarball
          tar -czf /tmp/world-factory.tar.gz -C /tmp/deploy .
          chmod +x /tmp/deploy/world_generator

          # Deploy via SSH
          scp -o StrictHostKeyChecking=no -i /tmp/prod_key \
            /tmp/world-factory.tar.gz \
            ${PRODUCTION_USER}@${PRODUCTION_HOST}:~/world-factory/

          ssh -o StrictHostKeyChecking=no -i /tmp/prod_key \
            ${PRODUCTION_USER}@${PRODUCTION_HOST} "
            cd ~/world-factory
            mkdir -p world-factory-\${{ steps.version.outputs.version }}
            tar -xzf world-factory.tar.gz -C world-factory-\${{ steps.version.outputs.version }}
            chown -R deploy:deploy ~/world-factory/
            ln -sf world-factory-\${{ steps.version.outputs.version }}/world_generator world_generator
            systemctl restart world-factory
            echo 'Deployed v\${{ steps.version.outputs.version }} to production'
          "
